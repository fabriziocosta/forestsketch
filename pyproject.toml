[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursivesketch"
version = "1.12.0"
description = "Iterative path sketching for scikit-learn pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Recursive Sketch contributors" },
]
dependencies = [
    "joblib>=1.2",
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.6",
    "openml>=0.14",
    "pandas>=1.5",
    "scikit-posthocs>=0.7",
    "tqdm>=4.65",
    "umap-learn>=0.5",
]

[tool.setuptools.packages.find]
include = ["recursivesketch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
